services:
  # ---------- Infraestructura ----------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      # Permite conexiones guest entre contenedores en este entorno local.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit loopback_users []'
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadminpassword}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket "audio" del contrato (raw/ y processed/) una vez y termina.
  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadminpassword}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/audio
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Servicios del Integrante 2 ----------
  catalog_service:
    build: ./services/catalog_service
    container_name: catalog_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # Worker Pool: varias copias independientes leen de la misma cola
  # (worker_ingesta.q). Con prefetch=1, RabbitMQ le da una canción a cada copia
  # libre. Sin container_name, porque un nombre fijo impide tener varias copias.
  worker_ingesta:
    build: ./services/worker_ingesta
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      # Eventos ya procesados, compartidos entre las copias (idempotencia).
      REDIS_URL: redis://redis:6379/1
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy

  # ---------- Servicios del Integrante 4 (métricas y notificaciones) ----------
  metrics_service:
    build:
      context: .
      dockerfile: services/metrics_service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_db}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "127.0.0.1:${METRICS_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_db}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  audio_service:
    build:
      context: .
      dockerfile: services/audio_service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASS: ${MINIO_PASS:-minioadminpassword}
      # Archivos de worker_ingesta: audio/processed/{song_id}/128.mp3 y 320.mp3
      AUDIO_BUCKET: audio
      AUDIO_KEY_TEMPLATE: "processed/{song_id}/{bitrate}.mp3"
      CATALOG_URL: http://catalog_service:8000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SEC: 3600
      CHUNK_SIZE: 1048576
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      METRICS_URL: http://metrics_service:8000
    ports:
      - "127.0.0.1:${AUDIO_PORT:-8003}:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user_service:
    build:
      context: ./services/user_service
    container_name: user_service
    # Crea sus tablas al importar la app: si Postgres todavía no acepta conexiones
    # el proceso termina. Esperar a que esté sano y reiniciar si igual se cae.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@postgres:5432/${POSTGRES_DB:-streaming_db}
      JWT_SECRET_KEY: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8011:8000"

  # Salas en vivo: WebSockets + estado en Redis. Sin estado propio: se puede
  # escalar con "docker compose up --scale rooms_service=2" (ver su README).
  rooms_service:
    build:
      context: .
      dockerfile: services/rooms_service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      CATALOG_URL: http://catalog_service:8000
      ROOM_TTL_SEC: 86400
      ROOM_DEFAULT_MAX_LISTENERS: 50
    ports:
      - "127.0.0.1:${ROOMS_PORT:-8006}:8000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      # HTTPS (certificado autofirmado de desarrollo): https://localhost:8443
      - "127.0.0.1:8443:443"
    depends_on:
      - user_service
      - catalog_service
      - audio_service
      - metrics_service
      - notification_service
      - rooms_service

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - gateway
    ports:
      # Por defecto solo esta PC. Para una demo en la red local: FRONTEND_BIND=0.0.0.0 en .env
      # (es la única puerta abierta: el resto de los servicios sigue en 127.0.0.1).
      - "${FRONTEND_BIND:-127.0.0.1}:5173:5173"



volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:
