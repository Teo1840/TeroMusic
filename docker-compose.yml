version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-streaming_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  user_service:
    build:
      context: ./user_service
    container_name: user_service
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/streaming_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  catalog_service:
    build:
      context: ./catalog_service
    container_name: catalog_service
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/streaming_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - postgres
      - user_service
    ports:
      - "8001:8000"

  audio_service:
    build:
      context: ./audio_service
    container_name: audio_service
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/streaming_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
    depends_on:
      - postgres
      - minio
      - user_service
    ports:
      - "8002:8000"

  metrics_service:
    build:
      context: ./metrics_service
    container_name: metrics_service
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/streaming_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - postgres
      - user_service
    ports:
      - "8003:8000"

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - user_service
      - catalog_service
      - metrics_service

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - gateway
    ports:
      - "5173:5173"

  

volumes:
  postgres_data:
  minio_data: