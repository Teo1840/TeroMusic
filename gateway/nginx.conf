events {}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    # --------------------------------------------------
    # CORS
    # --------------------------------------------------

    map $http_origin $cors_origin {
        default $http_origin;
        "" "";
    }

    # --------------------------------------------------
    # IP REAL DEL CLIENTE
    # El front (Vite) reenvía /api al gateway: sin esto todos los pedidos
    # parecerían venir del contenedor del front y compartirían el límite.
    # --------------------------------------------------

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    # off: se toma solo la última IP del header, la que puso el proxy del front
    # (que además reemplaza lo que haya mandado el cliente, ver vite.config.js).
    # Con "on" y todas las redes privadas como confiables, nginx seguía hacia la
    # izquierda y terminaba usando una IP escrita por el cliente: cambiándola en
    # cada pedido se salteaba el límite de login.
    real_ip_recursive off;

    # --------------------------------------------------
    # RATE LIMITING (contra abuso y denegación de servicio)
    # --------------------------------------------------

    # Solo los POST de login/registro y de subida usan los límites estrictos.
    map "$request_method:$uri" $auth_limit_key {
        "~^POST:/api/v1/auth/(login|register)$" $binary_remote_addr;
        default "";
    }

    map "$request_method:$uri" $upload_limit_key {
        "POST:/api/v1/catalog/songs/upload" $binary_remote_addr;
        default "";
    }

    # General: 20 pedidos/s por IP (con ráfagas de 100: el catálogo carga varios
    # reproductores juntos y cada uno pide URL firmada, forma de onda y metadata).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Stream: aparte del general, ya está protegido por la URL firmada que vence.
    # El navegador pide muchos rangos al adelantar/arrastrar la barra.
    limit_req_zone $binary_remote_addr zone=stream:10m rate=50r/s;
    # Login/registro: 30 por minuto por IP (frena fuerza bruta de contraseñas).
    # Ojo: con Docker Desktop todos los dispositivos de la red llegan con la misma IP
    # (la del NAT de Docker), así que en una demo comparten este cupo. Por eso es generoso.
    limit_req_zone $auth_limit_key zone=auth:10m rate=30r/m;
    # Subidas: 6 por minuto por IP (cada una dispara una transcodificación).
    limit_req_zone $upload_limit_key zone=upload:10m rate=6r/m;

    limit_req_status 429;

    # --------------------------------------------------
    # USER SERVICE
    # --------------------------------------------------

    upstream user_service {
        server user_service:8000;
    }

    # --------------------------------------------------
    # CATALOG SERVICE
    # --------------------------------------------------

    upstream catalog_service {
        server catalog_service:8000;
    }

    # --------------------------------------------------
    # AUDIO SERVICE
    # --------------------------------------------------

    # BALANCEO DE CARGA: audio_service y rooms_service pueden correr con varias
    # copias (docker-compose.scale.yml). "resolve" vuelve a preguntarle al DNS de
    # Docker cada 10 s, así las copias nuevas entran solas sin reiniciar el gateway.
    # Reparte con round-robin (lo de nginx por defecto). El header X-Upstream de la
    # respuesta muestra qué copia atendió cada pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream audio_service {
        zone audio_service 64k;
        server audio_service:8000 resolve;
    }

    # --------------------------------------------------
    # METRICS SERVICE
    # --------------------------------------------------

    upstream metrics_service {
        server metrics_service:8000;
    }

    upstream notification_service {
        server notification_service:8000;
    }

    upstream rooms_service {
        zone rooms_service 64k;
        server rooms_service:8000 resolve;
    }

    # WebSocket: "Connection: upgrade" solo si el cliente pidio Upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {

        listen 80;

        # A nivel server para que también aplique a la subrequest /auth_verify
        # (si no, rechaza con 413 cualquier subida > 1 MB). Igual a max_upload_mb.
        client_max_body_size 100m;

        # ==================================================
        # CORS OPTIONS
        # ==================================================


        # ==================================================
        # INTERNAL AUTH VERIFICATION
        # ==================================================

        location = /auth_verify {

            internal;

            proxy_pass http://user_service/verify;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Authorization $http_authorization;
        }

        # ==================================================
        # PUBLIC AUTH ROUTES
        # ==================================================

        # ==================================================
        # AUTH
        # ==================================================

        location /api/v1/auth/ {
            limit_req zone=api burst=100 nodelay;
            limit_req zone=auth burst=15 nodelay;

            proxy_pass http://user_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Correlation-Id $request_id;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # AUDIO
        # ==================================================

        # ==================================================
        # AUDIO
        # TEMPORALMENTE DESHABILITADO
        # Se habilita cuando exista el contenedor audio_service
        # ==================================================

        # Stream sin header Authorization (<audio src> no puede mandarlo):
        # audio_service exige una URL firmada que vence (?exp&sig).
        location /api/v1/audio/stream/ {
            limit_req zone=stream burst=200 nodelay;

            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_pass http://audio_service/audio/stream/;

            add_header X-Upstream $upstream_addr always;
        }

        location /api/v1/audio/ {
            limit_req zone=api burst=100 nodelay;

            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Correlation-Id $request_id;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;

            proxy_pass http://audio_service/audio/;

            add_header X-Upstream $upstream_addr always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # CATALOG
        # ==================================================

        location /api/v1/catalog/ {
            limit_req zone=api burst=100 nodelay;
            limit_req zone=upload burst=2 nodelay;


            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://catalog_service/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # METRICS
        # ==================================================

        location /api/v1/metrics/ {
            limit_req zone=api burst=100 nodelay;


            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://metrics_service/metrics/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # SALAS EN VIVO
        # ==================================================

        # REST: crear, listar, ver y cerrar salas (con login).
        # Sin "/" final: así entran /api/v1/rooms (crear/listar) y /api/v1/rooms/{id}.
        location /api/v1/rooms {
            limit_req zone=api burst=100 nodelay;

            auth_request /auth_verify;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://rooms_service/rooms;

            add_header X-Upstream $upstream_addr always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        }

        # WebSocket de cada sala: /api/v1/ws/rooms/{id} → rooms_service /rooms/{id}/ws
        # Sin auth_request: el navegador no puede mandar headers en un WebSocket.
        # El cliente se autentica con su JWT en el primer mensaje y lo valida rooms_service.
        location ~ "^/api/v1/ws/rooms/([0-9a-fA-F-]{36})$" {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://rooms_service/rooms/$1/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # La conexion queda abierta mientras se escucha (el servidor manda ping cada 25 s).
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Authenticated notification history for the current user.
        location /api/v1/notifications/ {
            limit_req zone=api burst=100 nodelay;

            auth_request /auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://notification_service/notifications/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ==================================================
        # DEFAULT
        # ==================================================

        location / {

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;

            return 404;
        }
    }
}