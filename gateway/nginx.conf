events {}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    # --------------------------------------------------
    # CORS
    # --------------------------------------------------

    map $http_origin $cors_origin {
        default $http_origin;
        "" "";
    }

    # --------------------------------------------------
    # USER SERVICE
    # --------------------------------------------------

    upstream user_service {
        server user_service:8000;
    }

    # --------------------------------------------------
    # CATALOG SERVICE
    # --------------------------------------------------

    upstream catalog_service {
        server catalog_service:8000;
    }

    # --------------------------------------------------
    # AUDIO SERVICE
    # --------------------------------------------------

    # ==================================================
    # AUDIO SERVICE
    # TEMPORALMENTE DESHABILITADO
    # Se habilita cuando exista el contenedor audio_service
    # ==================================================

    upstream audio_service {
        server audio_service:8000;
    }

    # --------------------------------------------------
    # METRICS SERVICE
    # --------------------------------------------------

    upstream metrics_service {
        server metrics_service:8000;
    }

    upstream notification_service {
        server notification_service:8000;
    }

    server {

        listen 80;

        # A nivel server para que también aplique a la subrequest /auth_verify
        # (si no, rechaza con 413 cualquier subida > 1 MB). Igual a max_upload_mb.
        client_max_body_size 100m;

        # ==================================================
        # CORS OPTIONS
        # ==================================================


        # ==================================================
        # INTERNAL AUTH VERIFICATION
        # ==================================================

        location = /auth_verify {

            internal;

            proxy_pass http://user_service/verify;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Authorization $http_authorization;
        }

        # ==================================================
        # PUBLIC AUTH ROUTES
        # ==================================================

        # ==================================================
        # AUTH
        # ==================================================

        location /api/v1/auth/ {
            proxy_pass http://user_service/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Correlation-Id $request_id;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # AUDIO
        # ==================================================

        # ==================================================
        # AUDIO
        # TEMPORALMENTE DESHABILITADO
        # Se habilita cuando exista el contenedor audio_service
        # ==================================================

        # Stream sin token: <audio src> no puede mandar Authorization.
        location /api/v1/audio/stream/ {
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_pass http://audio_service/audio/stream/;
        }

        location /api/v1/audio/ {
            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_set_header X-Correlation-Id $request_id;

            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;

            proxy_pass http://audio_service/audio/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # CATALOG
        # ==================================================

        location /api/v1/catalog/ {

            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://catalog_service/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # ==================================================
        # METRICS
        # ==================================================

        location /api/v1/metrics/ {

            auth_request /auth_verify;

            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://metrics_service/metrics/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        }

        # Authenticated notification history for the current user.
        location /api/v1/notifications/ {
            auth_request /auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;

            proxy_pass http://notification_service/notifications/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ==================================================
        # DEFAULT
        # ==================================================

        location / {

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;

            return 404;
        }
    }
}