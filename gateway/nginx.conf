events {}

http {

    resolver 127.0.0.11 valid=30s;

    server {

        listen 80;

        server_name _;

        # --------------------------------------------------
        # CORS
        # --------------------------------------------------

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # --------------------------------------------------
        # AUTH
        # --------------------------------------------------

        location /api/v1/auth/ {

            rewrite ^/api/v1/auth/(.*)$ /$1 break;

            proxy_pass http://user_service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # CATALOG
        # --------------------------------------------------

        location /api/v1/catalog/ {

            rewrite ^/api/v1/catalog/(.*)$ /$1 break;

            proxy_pass http://catalog_service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Authorization $http_authorization;
        }

        # --------------------------------------------------
        # AUDIO
        # --------------------------------------------------

        location /api/v1/audio/ {

            rewrite ^/api/v1/audio/(.*)$ /$1 break;

            proxy_pass http://audio_service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Authorization $http_authorization;

            # Importante para streaming
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
        }

        # --------------------------------------------------
        # METRICS
        # --------------------------------------------------

        location /api/v1/metrics/ {

            rewrite ^/api/v1/metrics/(.*)$ /$1 break;

            proxy_pass http://metrics_service:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Authorization $http_authorization;
        }
    }
}