# CORS de cada ruta (se incluye en cada location: en nginx, una location con su propio
# add_header no hereda los del server).
#
# El front no lo necesita: entra por el proxy de Vite (mismo origen). Esto es para quien
# llame al gateway desde otro origen permitido ($cors_origin en nginx.conf). Para el
# resto el header sale vacío y nginx no lo manda: el navegador bloquea la respuesta.
# Sin Allow-Credentials: el login viaja en Authorization, no en cookies.

add_header Access-Control-Allow-Origin $cors_origin always;
add_header Vary Origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-Range, X-Correlation-Id" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, X-Total-Count, X-Cache, X-Upstream, X-Correlation-Id" always;
add_header X-Upstream $upstream_addr always;
# El id del pedido vuelve al cliente: con él se buscan sus líneas en los logs.
add_header X-Correlation-Id $request_id always;

# Preflight: se contesta acá, antes de auth_request (el navegador no manda el token en
# el OPTIONS y si no, recibiría 401).
if ($request_method = OPTIONS) {
    return 204;
}
